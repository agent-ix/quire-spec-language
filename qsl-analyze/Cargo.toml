[package]
name = "qsl-analyze"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "ADR-011 §6.1 layer A: in-process analysis engines, including retained graphs, generic products and zone difference-bound matrices."

# ADR-011 §6.1 layer A may depend on "6, 5, 4, 3, R, F, SV, K". The graph
# engine uses layer 5's existing transition seam and foundation identities.
# The zone engine's DBM needs only layer K's exact rationals (the constants it
# scales) and arbitrary-precision integers for its bounds. It names no
# `qsl-replay` item: the certificate checker's DBM there is separate code
# (ADR-026 CF-6). The schedulability engine returns the task-set and outcome
# types of `qsl-replay`'s closed-form checker (layer A may depend on layer 6),
# and its arithmetic is its own, so the checker recomputes it independently.
[dependencies]
qsl-eval = { path = "../qsl-eval" }
qsl-foundation = { path = "../qsl-foundation" }
qsl-replay = { path = "../qsl-replay" }
# EN-1 reads the checked temporal clause and the subject's admission
# failure (layer 3), and the fairness set and property form (SV).
qsl-semantics = { path = "../qsl-semantics" }
quire-semantic-value = { workspace = true }
quire-canonical = { workspace = true }
quire-exact = { workspace = true }
num-bigint = "0.4.8"
num-integer = "0.1.47"
num-traits = "0.2.19"
thiserror = "2.0.20"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
# The model-check tests compile a modelled unit through S1 to S4 and check
# its temporal clauses with `qsl-semantics`' test-only `check_clauses`.
qsl-cst = { path = "../qsl-cst" }
qsl-forms = { path = "../qsl-forms" }
qsl-package = { path = "../qsl-package" }
# FR-124-AC-2: the request writer's deadlock-freedom item over the Counter
# subject's checked package.
qsl-route = { path = "../qsl-route" }
qsl-semantics = { path = "../qsl-semantics", features = ["test-support"] }
serde_json = "1.0.151"

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
