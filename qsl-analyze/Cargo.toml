[package]
name = "qsl-analyze"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "ADR-011 §6.1 layer A: in-process analysis engines, including retained graphs, generic products and zone difference-bound matrices."

# ADR-011 §6.1 layer A may depend on "6, 5, 4, 3, R, F, SV, K". The graph
# engine uses layer 5's existing transition seam and foundation identities.
# The zone engine's DBM needs only layer K's exact rationals (the constants it
# scales) and arbitrary-precision integers for its bounds. It names no
# `qsl-replay` item: the certificate checker's DBM there is separate code
# (ADR-026 CF-6). The schedulability engine returns the task-set and outcome
# types of `qsl-replay`'s closed-form checker (layer A may depend on layer 6),
# and its arithmetic is its own, so the checker recomputes it independently.
[dependencies]
qsl-eval = { path = "../qsl-eval" }
qsl-foundation = { path = "../qsl-foundation" }
qsl-package = { path = "../qsl-package" }
qsl-replay = { path = "../qsl-replay" }
# EN-1 reads the checked temporal clause and the subject's admission
# failure (layer 3), and the fairness set and property form (SV).
qsl-semantics = { path = "../qsl-semantics" }
# FR-336-AC-4: the request writer (layer R) the EN-1 request path writes a
# model subject's temporal items through.
qsl-route = { path = "../qsl-route" }
# ADR-011 §6.1 layer C: the checked terms (FR-400) the analysis reads.
quire-checked = { workspace = true }
quire-semantic-value = { workspace = true }
quire-canonical = { workspace = true }
# Strict admission authenticates the plan root final clause binding.
quire-contract-model = { workspace = true }
# The observation owner admits progress associations independently of QSL.
quire-observation = { git = "https://github.com/agent-ix/quire-observation", branch = "main" }
quire-exact = { workspace = true }
num-bigint = "0.4.8"
num-integer = "0.1.47"
num-traits = "0.2.19"
thiserror = "2.0.20"
# ADR-012 section 9: the `#[string_edge]` marker `claim_family` decodes wire
# words at, and the trace tags of the tests.
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
serde_json = "1.0.151"

# `Por::visible` and `Por::candidate_seeded_by` let a test read the visibility
# and the candidate that `Por::ample` decides on. Only the dev-dependency on
# this crate enables the feature; no shipped build has the methods.
[features]
test-support = []

[dev-dependencies]
# `V2ReadLimits::fixture`, the explicit finite fixture limits (FR-358).
qsl-package = { path = "../qsl-package", features = ["test-support"] }
qsl-analyze = { path = ".", features = ["test-support"] }
# FR-237's timed replay core (`replay_timed_counterexample`), driven by the
# zone replay tests until S4 writes timed members (QSL-580).
qsl-replay = { path = "../qsl-replay", features = ["test-support"] }
# The model-check tests compile a modelled unit through S1 to S4 and check
# its temporal clauses with `qsl-semantics`' test-only `check_clauses`.
qsl-cst = { path = "../qsl-cst" }
qsl-forms = { path = "../qsl-forms" }
quire-checked = { workspace = true, features = ["test-support"] }
qsl-semantics = { path = "../qsl-semantics", features = ["test-support"] }
# `ProtocolTransition::carrying` and `SendRecord::with_outcome`, which the
# replay tests use to change or misplace a send record (FR-217-AC-5/AC-6).
qsl-eval = { path = "../qsl-eval", features = ["test-support"] }
quire-eval = { workspace = true }
# FR-159-AC-5 validates EN-1's manifest entry against QSpec's backend-provider
# schema, read in place from `$QSPEC_DIR`.
jsonschema = { version = "0.17.1", default-features = false, features = ["draft202012"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
