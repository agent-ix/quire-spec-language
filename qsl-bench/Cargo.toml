[package]
name = "qsl-bench"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "QSL-196: the committed performance benchmarks (parser, checker, CST identity hashing, model layer, evaluator) and the probe that records their baseline counts."

# A benchmark-only crate: no workspace crate depends on it, and it depends on
# the layer crates only through their public API, so a benchmark keeps
# compiling across an internal rewrite of the layer it times (QSL-197
# rewrites the S1 parser behind `qsl_cst::parse`).
[dependencies]
qsl-cst = { path = "../qsl-cst" }
qsl-foundation = { path = "../qsl-foundation" }
qsl-forms = { path = "../qsl-forms" }
qsl-semantics = { path = "../qsl-semantics" }
qsl-package = { path = "../qsl-package" }
qsl-eval = { path = "../qsl-eval" }
quire-exact = { path = "../quire-exact" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
# F13 (QSL-196): the third of model intake's three parses of the same bytes
# is this crate's own `json::parse`; the model probe times it alone. Same
# pinned revision `qsl-semantics` already locks -- no new package.
agent-ix-semantic-ir = { git = "https://github.com/agent-ix/filament-core-data", rev = "1572ba4ba8fad0e94e9a0b19a569f82a5181b488" }

[dev-dependencies]
# Default features off: no rayon, no plotters. `cargo_bench_support` is the
# one feature `cargo bench` needs.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "checker"
harness = false

[[bench]]
name = "cst"
harness = false

[[bench]]
name = "model"
harness = false

[[bench]]
name = "evaluator"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
