[package]
name = "qsl-eval"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "ADR-011 §6.1 layer 5: the S6a evaluator (value::expression) over the layer-4 checked package, and the finite exploration engine (simulation)."

# ADR-011 §6.1 layer 5 depends on "4, 3, F, K". The root crate's
# `tests/it/family_outcome_layering.rs` (TC-390) asserts this table exactly:
# the four layer crates, plus the third-party crates the shipped code calls.
# No `test-support` feature: nothing here is test-only.
[dependencies]
qsl-foundation = { path = "../qsl-foundation" }
qsl-package = { path = "../qsl-package" }
qsl-semantics = { path = "../qsl-semantics" }
quire-exact = { path = "../quire-exact" }
# ADR-011 X-8: the simulation state key and the pinned sampler's draw
# preimage encode through the one RFC 8785 implementation (FR-101).
quire-canonical = { workspace = true }
# The pinned sampler's draw preimage and the simulation-state typed
# canonical form fixtures are `Serialize` (FR-101; ADR-011 X-8).
serde = { version = "=1.0.228", features = ["derive"] }
# The derived `Error` impls of `InputRefusal`, `CallFailure` and
# `InvalidQualifiedName`.
thiserror = "=2.0.20"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
# QSL-248 (G2): test-only since the layer-5 `quire.checked-function-package/
# v2` codec (`emit_function_package_v2`/`decode_function_package_v2`, its
# one shipped caller) was deleted; several `tests/it/*.rs` fixtures still
# build JSON directly.
serde_json = "=1.0.151"
# The evaluator's tests build `PackageDeclarations` from layer-2 parsed forms
# (`Expression`, `FunctionDeclaration`, `TypeForm`): `check` takes forms as its
# input and qsl-semantics exposes no builder of them. Layer 2 is below this
# crate, so the edge closes no cycle; TC-390 admits it in this table only.
qsl-forms = { path = "../qsl-forms" }
# FR-091-AC-13: a function compiled from source text through S1 and S2 is
# called here.
qsl-cst = { path = "../qsl-cst" }
# `qsl-semantics`' test-only fixtures (`DeclarationKey::fixture`,
# `DomainPackageRef::fixture`, `model::refusal::fixtures`, ...). Only this
# dev-dependency enables `test-support`: the root crate's
# `no_shipped_dependency_enables_test_support` refuses a normal or build
# dependency that does.
qsl-semantics = { path = "../qsl-semantics", features = ["test-support"] }
# QSL-206: the ordered charge log (`Meter::admitted_charges`) the
# charge-sequence tests assert. A production meter keeps a count only; only
# this dev-dependency enables `test-support`.
quire-exact = { path = "../quire-exact", features = ["test-support"] }
sha2 = "=0.10.9"

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# FR-063: `seam_probe` is the `RUSTFLAGS`-set `--cfg` `xtask seam-probe`
# builds this crate under; `seam_probe_downstream` gives `qsl-semantics`' own
# seams their probe arm, so this crate's probe build reaches its own seams.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(seam_probe)", "cfg(seam_probe_downstream)", "cfg(seam_probe_eval_downstream)"] }

[lints.clippy]
all = "deny"
