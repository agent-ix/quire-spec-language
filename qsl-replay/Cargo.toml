[package]
name = "qsl-replay"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "ADR-011 §6.1 layer 6: the CG-facing replay facade -- the TK-01 replay executor, the spine S1-to-S4 compile it recompiles through, and the four #231 typed envelopes (proof result, witness, replay request, replay result)."

# ADR-011 §6.1 layer 6 `replay` depends on "layers 1 to 5, F, K": the spine
# recompile (S1 `qsl-cst`, S2 `qsl-forms`, I1 and S3 `qsl-semantics`, S4
# `qsl-package`) and the S6a call (`qsl-eval`) of the TK-01 executor (QSL-5).
[features]
default = []
# ADR-011 §6.1 layer-6 row: "I3 under feature `quire-extraction`". FR-109's
# `run_clause` accepts an I3 extracted source (`qsl_source::ExtractedSource`)
# as its unit only with this feature (QSL-295).
quire-extraction = ["dep:qsl-source", "qsl-source/quire-extraction"]

[dependencies]
qsl-attrs = { path = "../qsl-attrs" }
qsl-cst = { path = "../qsl-cst" }
qsl-eval = { path = "../qsl-eval" }
qsl-forms = { path = "../qsl-forms" }
qsl-foundation = { path = "../qsl-foundation" }
qsl-package = { path = "../qsl-package" }
qsl-semantics = { path = "../qsl-semantics" }
qsl-source = { path = "../qsl-source", optional = true }
quire-exact = { path = "../quire-exact" }
thiserror = "=2.0.20"

[dev-dependencies]
serde_json = "=1.0.151"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
# `qsl-semantics`' test-only fixtures (`check::fixture_source`,
# `PackageDeclarations`, `CheckMode::Kernel`'s `check_expression`) for
# `spine::call`'s own tests (TC-452 step 5, FR-100-AC-10): a standalone
# `sum` checked under `CheckMode::Kernel`, which a real compiled program
# can never reach (QSpec FR-145 refuses an unproved linked `sum` at
# checking). Resolver 2 turns `test-support` on only when a test target is
# built (`tests/it/family_outcome_layering.rs`'s
# `no_shipped_dependency_enables_test_support`, in the root crate, covers
# every workspace crate), so it never reaches the production lib.
qsl-semantics = { path = "../qsl-semantics", features = ["test-support"] }
# QSL-278: the ordered charge log (`Meter::admitted_charges`) FR-107-AC-3's
# `reaches` charge-sequence test asserts. A production meter keeps a count
# only; only this dev-dependency enables `test-support`.
quire-exact = { path = "../quire-exact", features = ["test-support"] }
# QSL-278: FR-106's snapshot/invocation `DocumentRef.digest` is the
# document's own `sha256-jcs` digest (FR-056's digest-first rule); the test
# fixture computes it the same way `model::observation`'s own
# `document_digest` does, over the one RFC 8785 implementation, rather than
# guessing or duplicating that logic.
quire-canonical = { workspace = true }
# QSL-313 (FR-105-AC-6): the fault-injection seam
# (`emit_checked_with_fault`/`checked_node_id_of`) is public only under
# `test-support` (qsl-package's own Cargo.toml); this dev-dependency edge is
# how `spine::clause`'s own tests reach it to fault the `frame` node of a
# compiled state-clause package.
qsl-package = { path = "../qsl-package", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# FR-063: `xtask seam-probe` builds this crate under `--cfg seam_probe --cfg
# seam_probe_downstream --cfg seam_probe_eval_downstream`, which reports its
# own seam, and the root crate adds `--cfg seam_probe_replay_downstream`,
# which gives that seam its probe arm.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(seam_probe)", "cfg(seam_probe_downstream)", "cfg(seam_probe_eval_downstream)", "cfg(seam_probe_replay_downstream)"] }

[lints.clippy]
all = "deny"
