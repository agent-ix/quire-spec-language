[package]
name = "quire-exact"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "ADR-011 X-1: the quire-exact kernel -- checked identity, typestate, outcome/refusal, provenance and bound value types with no dependency on any other crate in the quire ecosystem."

[features]
# The ordered charge log (`Meter::admitted_charges`). A production
# meter keeps a count only; tests that assert exact charge sequences enable
# this through a dev-dependency, which resolver 2 turns on only for test
# builds. TC-243 (`no_shipped_dependency_enables_test_support`) refuses a
# normal or build dependency that enables it.
test-support = []

[dependencies]
num-bigint = { version = "0.4.8", default-features = false }
num-integer = { version = "0.1.47", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
thiserror = { version = "2.0.20", default-features = false }
unicode-normalization = { version = "0.1.25", default-features = false }

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
