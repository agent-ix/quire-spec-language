# SPDX-License-Identifier: AGPL-3.0-or-later
# FR-080-AC-2 / TC-205: `cargo deny check bans` denies `inventory`, `linkme`
# and `ctor` outright. ADR-012 §5.3's registry evidence: the `#185` registry
# (`qsl-route/src/lib.rs`) is an ordinary value, never populated through a
# link-time/plugin-discovery mechanism, and this is the positive-fail gate
# that would catch a future contributor reintroducing one -- it is not
# satisfied merely by the crate graph's current absence of the three crates.
#
# ADR-013 §2: `quire-canonical` is QSL's one RFC 8785 implementation, so the
# `quire-canonical` entry denies a second copy of it in the resolved graph.
#
# Scoped to `check bans` only (`make cargo-deny-bans`, which runs `cargo deny
# --workspace check bans` over every workspace crate): this file configures no
# license or advisory policy, so it does not claim to gate either, and a bare
# `cargo deny check` should not be run against it for that reason.
[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { name = "inventory" },
    { name = "linkme" },
    { name = "ctor" },
    # ADR-013 §2: one RFC 8785 implementation. Two copies of the encoder
    # could produce different package_ids.
    { crate = "quire-canonical", deny-multiple-versions = true },
    # One copy of each shared leaf in the lock: `quire-semantic-value` and
    # every QSL crate must resolve `quire-exact` to the same source.
    { crate = "quire-exact", deny-multiple-versions = true },
    { crate = "quire-semantic-value", deny-multiple-versions = true },
]
