[package]
name = "qsl-route"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "ADR-011 §6.1 layer R: the #185 capability-backend registry and router over the canonical capability kind."

# ADR-011 §6.1 layer R may depend on "4, 3, F, K"; `route` names only layer
# 3 (`qsl_semantics::check::Capability`) and F (`qsl_foundation`'s
# `DigestRecord`, `DigestDomain` and `CatalogCode`). The root crate's
# `tests/it/family_outcome_layering.rs` (TC-390) asserts that this table
# names no other workspace crate.
[dependencies]
qsl-foundation = { path = "../qsl-foundation" }
qsl-semantics = { path = "../qsl-semantics" }
thiserror = "=2.0.20"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
# `tests/it/route_registry.rs` (TC-205) writes a throwaway manifest for
# `cargo deny check bans` into a scratch directory.
tempfile = "=3.27.0"

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
