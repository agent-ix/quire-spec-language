[package]
name = "qsl-cst"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "ADR-011 §6.1 layer 1: the complete-V1 recovering concrete syntax tree -- token vocabulary, lexer, parser, declarative grammar and located diagnostics."

[features]
# Test-only fixture constructors (`LosslessCst::fixture`) — never enabled in a
# production build; the root crate's `[dev-dependencies]` turns it on so its
# `forms::dispatch` unit tests can reach it in both feature lanes (mirrors the
# root crate's own `test-support` convention, PR #140 F13).
test-support = []

[dependencies]
qsl-foundation = { path = "../qsl-foundation" }
logos = "=0.16.1"
serde_json = "=1.0.151"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
