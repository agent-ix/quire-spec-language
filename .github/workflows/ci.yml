# SPDX-License-Identifier: AGPL-3.0-or-later
name: Native compiler
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Install pinned coverage reporter
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints with minimal features
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - name: Native behavior with minimal features
        run: cargo test --locked --workspace --no-default-features
      - name: Lints with all native integrations
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Compiler, runtime, extraction and CLI
        run: cargo test --locked --workspace --all-features
      - name: Clean build
        run: cargo build --locked --workspace --no-default-features --target-dir target/clean
      - name: Review fixture identity negative controls
        run: cargo run --locked --no-default-features --bin fixture-audit -- self-test
      - name: Parse example
        run: cargo run --locked --no-default-features -- parse test:parent fixture:1 tests/fixtures/parent.native
