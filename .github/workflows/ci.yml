name: Native compiler
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    # Raised from 10 (PR #305 review round 2, finding 5): this job now also
    # installs cargo-deny 0.19.8 from source (a cold-cache release build
    # measured locally at ~2 minutes with a warm crates.io index; a fresh
    # runner with a cold index and no local download cache is slower), on
    # top of installing cargo-llvm-cov, two clippy passes, two test passes,
    # a docs build and a clean build. 10 minutes did not have margin for
    # that even before this change.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: No committed binaries
        run: tools/check-no-committed-binaries.sh
      - name: Spec index completeness (FR/TC master index)
        run: tools/check-index-completeness.sh
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Install pinned coverage reporter
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints with minimal features
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - name: Native behavior with minimal features
        run: cargo test --locked --workspace --no-default-features
      - name: Lints with all native integrations
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Compiler, runtime, extraction and CLI
        run: cargo test --locked --workspace --all-features
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps --all-features
      - name: Clean build
        run: cargo build --locked --workspace --no-default-features --target-dir target/clean
      - name: Review fixture identity negative controls
        run: cargo run --locked --no-default-features --bin fixture-audit -- self-test
      - name: Parse example
        run: cargo run --locked --no-default-features -- parse test:parent fixture:1 tests/fixtures/parent.native
      - name: Registry bans (cargo-deny)
        run: cargo deny check bans --config deny.toml
