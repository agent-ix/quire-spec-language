[package]
name = "xtask"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "Workspace developer tooling: cargo xtask seam-probe / string-edge."

[dependencies]
# FR-059's `graph::classify` (ecosystem packages, ADR-032 DT-4).
arch-lint = { path = "../tools/arch-lint" }
qsl-attrs = { path = "../qsl-attrs" }
serde_json = { version = "1.0.151" }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "2.0.119", features = ["full", "visit"] }
thiserror = "2.0.20"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
