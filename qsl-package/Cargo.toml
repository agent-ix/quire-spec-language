[package]
name = "qsl-package"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "ADR-011 §6.1 layer 4: the S4 checked-package typestate, the quire.checked-package/v2 emitter and the I2 byte reader."

# ADR-011 §6.1 layer 4 depends on "3, F, K; `quire-contract-model` for v2
# wire constants and round-trip tests only". This crate names K
# (`quire-exact`) only in its tests, so K is a dev-dependency here (ADR-011
# §7.1: a dependency needed only by tests is a dev dependency). The root
# crate's `tests/it/family_outcome_layering.rs` (TC-390) asserts that this
# table names no other workspace crate.
[dependencies]
qsl-foundation = { path = "../qsl-foundation" }
qsl-semantics = { path = "../qsl-semantics" }
# The v2 wire vocabulary: the identity-preimage types the emitter builds and
# IR's `checked_package` v2 reader the I2 byte reader delegates to.
quire-contract-ir = { package = "quire-contract-model", git = "https://github.com/agent-ix/quire-contract-ir", rev = "dbb2e22d577b56fed5c27e81e584370acdf02512" }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
# The emitter's tests build a one-function `PackageDeclarations`, whose
# declarations are layer-2 parsed forms. Layer 2 is below this crate, so the
# edge closes no cycle; TC-390 admits it in this table only.
qsl-forms = { path = "../qsl-forms" }
# `check::imports` (the reader's tests) is public only under `test-support`.
# Only this dev-dependency enables it: the root crate's
# `no_shipped_dependency_enables_test_support` refuses a normal or build
# dependency that does.
qsl-semantics = { path = "../qsl-semantics", features = ["test-support"] }
quire-exact = { path = "../quire-exact" }
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
