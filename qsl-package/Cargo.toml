[package]
name = "qsl-package"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "ADR-011 §6.1 layer 4: the S4 checked-package typestate, the quire.checked-package/v2 emitter and the I2 byte reader."

[features]
# QSL-313: `emit_checked_with_fault` and `checked_node_id_of`, the FR-105-AC-6
# fault-injection seam, are public only under `test-support` (the same
# pattern qsl-semantics uses, see its Cargo.toml), so a dependent crate's own
# tests (qsl-replay) can reach them without shipping a test-only hook in the
# production API. `tests/it/family_outcome_layering.rs`'s
# `no_shipped_dependency_enables_test_support` refuses a normal or build
# dependency that enables it.
test-support = []

# ADR-011 §6.1 layer 4 depends on "3, F, K; `quire-contract-model` for the
# v2 wire contract" (X-7). The root crate's
# `tests/it/family_outcome_layering.rs` (TC-390) asserts that this table
# names no other workspace crate.
[dependencies]
# ADR-012 section 9 / FR-064: the `#[string_edge]` marker attribute, exempt
# from the layer table below (it is a zero-cost marker `xtask string-edge`
# reads, not a semantic dependency).
qsl-attrs = { path = "../qsl-attrs" }
qsl-foundation = { path = "../qsl-foundation" }
qsl-semantics = { path = "../qsl-semantics" }
# K: the I2 reader keys the v2 source map by the kernel occurrence `Origin`
# (ADR-013 O-07).
quire-exact = { path = "../quire-exact" }
# The v2 wire vocabulary: the identity-preimage types the emitter builds and
# IR's `checked_package` v2 reader the I2 byte reader delegates to.
quire-contract-ir = { package = "quire-contract-model", git = "https://github.com/agent-ix/quire-contract-ir", rev = "2a286437f6926dbefa9963dae196b22912114dc1" }
# ADR-013 §2 (ADR-013:113): the one RFC 8785 implementation; the
# `package_id` preimage encodes through it (QSL-194).
quire-canonical = { workspace = true }
# The emitter writes its wire envelope as a `Serialize` struct over IR's
# types; it encodes through `quire-canonical` only (QSL-194).
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.20"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
# The emitter's tests build a one-function `PackageDeclarations`, whose
# declarations are layer-2 parsed forms. Layer 2 is below this crate, so the
# edge closes no cycle; TC-390 admits it in this table only.
qsl-forms = { path = "../qsl-forms" }
# The S1 -> S2 -> S3 -> S4 round trip (FR-091) parses its unit with S1.
qsl-cst = { path = "../qsl-cst" }
# `check::imports` (the reader's tests) is public only under `test-support`.
# Only this dev-dependency enables it: the root crate's
# `no_shipped_dependency_enables_test_support` refuses a normal or build
# dependency that does.
qsl-semantics = { path = "../qsl-semantics", features = ["test-support"] }
# The tests build v2 wires and golden preimages as JSON.
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
