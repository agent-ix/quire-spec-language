[package]
name = "qsl-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"
description = "cargo-fuzz targets: deeply nested QSL sources through the S1 parser and the S3 checker (FR-356-AC-7)."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The generator and the S1-to-S4 driver, built and tested by `make ci`.
qsl-bench = { path = "../qsl-bench" }

# Its own workspace (`exclude = ["fuzz"]` in the root): the target is a
# `no_main` libFuzzer binary, which cannot build or link under the main
# workspace's `cargo build/test --workspace --all-targets`.
[workspace]
members = ["."]

[[bin]]
name = "deep_input"
path = "fuzz_targets/deep_input.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
