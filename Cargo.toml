[workspace]
members = ["."]
resolver = "2"

[package]
name = "quire-spec-language"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"
description = "Native finite-state specification syntax and source diagnostics"
default-run = "quire-spec"

[features]
default = []

[dependencies]
logos = "=0.16.1"
serde_json = { version = "=1.0.151", features = ["unbounded_depth"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.20"
quire-contract-ir = { git = "https://github.com/agent-ix/quire-contract-ir", rev = "690bde7f2dc58662cf9ff0595c2c0e3b17107c6f" }

[dev-dependencies]
jsonschema = { version = "=0.17.1", default-features = false, features = ["draft202012"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
tempfile = "=3.27.0"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }

[[bin]]
name = "quire-spec"
path = "src/main.rs"

[[bin]]
name = "fixture-audit"
path = "tools/fixture-audit/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
