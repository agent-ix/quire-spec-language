[workspace]
members = [".", "xtask", "quire-exact"]
resolver = "2"

[package]
name = "quire-spec-language"
version = "0.2.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "Native finite-state specification syntax and source diagnostics"
default-run = "quire-spec"

[features]
default = []
quire-extraction = ["dep:quire-rs"]
# Test-only fixture constructors (`DeclarationKey::fixture`,
# `DomainPackageRef::fixture`, `DomainPackageRef::fixture_with_version`) that
# derive a digest from a display identity —
# never enabled in a production build; `cargo test --all-features` turns it on
# so integration tests in `tests/` can reach them (PR #140 F13).
test-support = []

[dependencies]
quire-rs = { git = "https://github.com/agent-ix/quire-rs", rev = "8b8020e665c61a11bc74f3f23b84617c80c0c442", optional = true, default-features = false }
logos = "=0.16.1"
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
serde_json = { version = "=1.0.151", features = ["unbounded_depth", "raw_value"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.20"
unicode-normalization = "=0.1.25"
quire-contract-ir = { package = "quire-contract-model", git = "https://github.com/agent-ix/quire-contract-ir", rev = "53cc03c639e2e26528132d34d96dc56449df78e8" }

[dev-dependencies]
jsonschema = { version = "=0.17.1", default-features = false, features = ["draft202012"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
tempfile = "=3.27.0"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
quire-contract-codegen = { git = "https://github.com/agent-ix/quire-contract-codegen", rev = "5e2a6a994d2107f36294078ad202467a4c66bb75" }
quire-contract-ir-historical = { package = "quire-contract-ir", git = "https://github.com/agent-ix/quire-contract-ir", rev = "04eb6f849c03be23177d373549c6c272551f957d" }
syn = { version = "=2.0.119", features = ["full"] }

[[bin]]
name = "quire-spec"
path = "src/main.rs"

[[bin]]
name = "fixture-audit"
path = "tools/fixture-audit/main.rs"

# FR-059/FR-060/FR-061 (ADR-011 §7.1 T-12, #215): architecture-conformance
# checks over the QSL/IR/RT/CG ecosystem. Self-contained (does not link
# `quire-spec-language`); see tools/arch-lint/main.rs.
[[bin]]
name = "arch-lint"
path = "tools/arch-lint/main.rs"

# These integration tests call the `test-support`-gated fixture constructors
# (`DeclarationKey::fixture`, `DomainPackageRef::fixture`,
# `DomainPackageRef::fixture_with_version`) documented above `test-support`.
# Declaring `required-features` here — rather
# than gating the calls inside each test file — keeps a default-feature
# `cargo clippy --all-targets`/`cargo test` build (no `test-support`) skipping
# these targets outright instead of failing to compile them (#154).
[[test]]
name = "model_conformance"
path = "tests/model_conformance.rs"
required-features = ["test-support"]

[[test]]
name = "model_dispatch"
path = "tests/model_dispatch.rs"
required-features = ["test-support"]

[[test]]
name = "model_normalization"
path = "tests/model_normalization.rs"
required-features = ["test-support"]

[[test]]
name = "model_population"
path = "tests/model_population.rs"
required-features = ["test-support"]

[[test]]
name = "model_systems"
path = "tests/model_systems.rs"
required-features = ["test-support"]

[[test]]
name = "model_reference_queries"
path = "tests/model_reference_queries.rs"
required-features = ["test-support"]

[[test]]
name = "dispatch_calls"
path = "tests/dispatch_calls.rs"
required-features = ["test-support"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
