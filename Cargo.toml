[workspace]
members = [".", "xtask", "tools/arch-lint", "qsl-walk-grow", "qsl-attrs", "qsl-foundation", "qsl-cst", "qsl-replay", "qsl-source", "qsl-forms", "qsl-semantics", "qsl-package", "qsl-route", "qsl-eval", "qsl-analyze", "qsl-bench"]
resolver = "2"
# A cargo-fuzz crate with its own workspace; fuzz/Cargo.toml says why.
exclude = ["fuzz"]

[workspace.dependencies]
# `default-features = false`: the encoder builds `no_std` + `alloc`, so the
# layer-SV leaf `quire-semantic-value` can mint the compound-unit id
# through it; a crate that writes through `io::Write` turns on `std`.
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", branch = "main", default-features = false }
# The shared no_std exact-value kernel and the semantic-value leaf above it,
# each its own repository so IR, RT and CG depend on them without the QSL repo.
quire-exact = { git = "https://github.com/agent-ix/quire-exact", branch = "main" }
quire-semantic-value = { git = "https://github.com/agent-ix/quire-semantic-value", rev = "e0ada80708fe73469923a9d6c2263cfebc0087a0" }
# ADR-011 §6.1 layer W: the shared no_std walker toolkit (ADR-030 D-1 item 2),
# its own repository so IR, RT and CG depend on it without the QSL repo.
quire-walk = { git = "https://github.com/agent-ix/quire-walk", branch = "main" }

[package]
name = "quire-spec-language"
version = "0.2.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "Native finite-state specification syntax and source diagnostics"
default-run = "quire-spec"

[features]
default = []
# ADR-011 §7.3 X-4: the I3 adapter crate `qsl-source` owns the
# quire-rs dependency; this feature builds it with its own `quire-extraction`,
# and turns on `qsl-replay`'s, so FR-109's `run_clause` accepts an I3 source.
quire-extraction = ["dep:qsl-source", "qsl-source/quire-extraction", "qsl-replay/quire-extraction"]
# `protocol_artifact::handoff::{write_v1, write_v2}`, the complete
# compiled-protocol handoff producer a downstream crate calls in-process. It
# embeds the authored `examples/protocol-handoff/` recipe inputs, so the
# default build leaves it out. It adds no dependency.
handoff-writer = []

[dependencies]
# ADR-013 O-05: only `model` calls the kernel `EffectiveId` constructor,
# enforced by the ADR-011 T-12 arch-lint `api-surface` check (`tools/arch-lint`),
# not by this dependency edge itself -- every crate that depends on
# `quire-exact` is in that check's scope, this one included as of this edit.
quire-exact = { workspace = true }
# ADR-011 §6.1 layer SV: the expression `Origin` the run output renders; the
# tests also assert its refusal vocabulary and runtime enum values.
quire-semantic-value = { workspace = true }
# ADR-013 §2 (ADR-013:113): the FR-051/FR-052 checked-handoff and
# native-temporal document identities encode through the one RFC 8785
# implementation.
quire-canonical = { workspace = true }
# ADR-011 §7.3 X-2: layer F, extracted out of this crate.
qsl-foundation = { path = "qsl-foundation" }
# ADR-011 §7.3 X-3: layer 1, extracted out of this crate.
qsl-cst = { path = "qsl-cst" }
# ADR-011 §7.3 X-5: layer 2, extracted out of this crate.
qsl-forms = { path = "qsl-forms" }
# ADR-011 §7.3 X-6: layer 3, extracted out of this crate. This crate
# re-exports none of its items (ADR-011 §7.2); callers name them at
# `qsl_semantics::...`.
qsl-semantics = { path = "qsl-semantics" }
# ADR-011 §7.3 X-7: layer 4, extracted out of this crate. This crate
# re-exports none of its items (ADR-011 §7.2); callers name them at
# `qsl_package::...`.
qsl-package = { path = "qsl-package" }
# ADR-011 §6.1 layer 6 `replay`: `command`'s CLI `compile` calls
# its spine compile (`qsl_replay::spine`), the one S1-to-S4 chain `replay`
# and `command` share. This crate re-exports none of its items.
qsl-replay = { path = "qsl-replay" }
# ADR-011 §7.3 X-4: layer I3, extracted out of this crate. This
# crate reaches quire-rs only through it (ADR-011 §6.1 layer-6 row).
qsl-source = { path = "qsl-source", optional = true }
logos = "0.16.1"
num-bigint = "0.4.8"
num-integer = "0.1.47"
num-traits = "0.2.19"
serde_json = { version = "1.0.151", features = ["unbounded_depth", "raw_value"] }
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.20"
unicode-normalization = "0.1.25"
# one-copy-deps (agent-ix org-wide, IR #225/RT #88): branch = "main", no rev,
# so an identical spec in every dependent unifies to one lockfile entry
# instead of pinning independently per repo.
quire-contract-model = { git = "https://github.com/agent-ix/quire-contract-ir", branch = "main" }
qsl-attrs = { path = "qsl-attrs" }

[dev-dependencies]
# `qsl-semantics`' test-only fixtures and views (`ReaderAuthority::fixture`,
# `DeclarationKey::fixture`, `check::family::fixtures`, ...) for this crate's
# unit and integration tests. Only this dev-dependency may enable
# `test-support`: `tests/it/family_outcome_layering.rs`
# (`no_shipped_dependency_enables_test_support`) refuses a normal or build
# dependency that does. Resolver 2 turns it on only when a test target is
# built, so it never reaches the production lib.
qsl-semantics = { path = "qsl-semantics", features = ["test-support"] }
# ADR-011 §7.3 X-9: layer R, extracted out of this crate. No
# shipped module of this crate calls it, so it is a dev dependency only
# (ADR-011 §7.1: "A dependency needed only by tests is a dev dependency"):
# `tests/it/lowering_registry_isolation.rs` builds a `qsl_route::Registry`
# beside the SEAM-1 lowering pipeline. This crate re-exports none of its
# items (ADR-011 §7.2).
qsl-route = { path = "qsl-route" }
tempfile = "3.27.0"
jsonschema = { version = "0.17.1", default-features = false, features = ["draft202012"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
# TC-257 (FR-088-AC-1) reuses `xtask::definition_scan::scan_crate`'s existing
# whole-crate `syn` scanner instead of a second, byte-identical copy; a
# workspace path dependency, dev-only, so it adds no edge to any shipped
# build (PR #300 review).
xtask = { path = "xtask" }
# The ordered charge log (`Meter::admitted_charges`) the
# charge-sequence tests assert. A production meter keeps a count only; only
# this dev-dependency enables `test-support`.
quire-exact = { workspace = true, features = ["test-support"] }
# TC-251's signature scanner (`tests/it/name_resolution_confinement.rs`)
# walks a parameter/return type's own AST directly (an exact path-segment
# match, `syn::visit::Visit`) rather than text-matching a `Debug`-formatted
# tree, so it needs only "full" (the full grammar) and "visit" -- PR #300
# review round 2, L5 dropped the "extra-traits" feature that used to exist
# solely to put `Debug` on `syn::Type` for that string search.
syn = { version = "2.0.119", features = ["full", "visit"] }

[[example]]
name = "native_protocol_handoff"
required-features = ["handoff-writer"]
test = true

[[example]]
name = "native_protocol_v2_handoff"
required-features = ["handoff-writer"]
test = true

[[bin]]
name = "quire-spec"
path = "src/main.rs"

# Every former `tests/*.rs` integration-test target is now a
# `mod` of this one `tests/it/main.rs` binary (see that file's own doc for
# the full rationale). It needs no `required-features`: the `qsl-semantics`
# fixtures its modules call are enabled by that crate's dev-dependency above.
[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# QSL#214 (FR-063): `seam_probe` is a `RUSTFLAGS`-set `--cfg`, not a Cargo
# feature -- `--all-features` activates every real Cargo feature
# unconditionally, and this probe is designed to fail to compile (`E0004`),
# so a Cargo feature would break `--all-features` on every build once it
# existed (measured: it did). Declaring the cfg name here is what
# `xtask seam-probe`'s own `RUSTFLAGS=--cfg seam_probe` build needs to avoid
# trading that break for an `unexpected_cfgs` one under `-D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(seam_probe)"] }

[lints.clippy]
all = "deny"
