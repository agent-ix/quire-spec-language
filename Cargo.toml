[workspace]
members = [".", "xtask", "tools/arch-lint", "tools/fsl-probability-check", "tools/fsl-hybrid-test-provider", "fsl-walk-grow", "fsl-foundation", "fsl-cst", "fsl-command", "fsl-conformance", "fsl-replay", "fsl-source", "fsl-forms", "fsl-semantics", "fsl-package", "fsl-route", "fsl-eval", "fsl-analyze", "fsl-hybrid-reference", "fsl-inspect", "fsl-bench", "fsl-string-edge", "tests/fixtures/checked-closure-consumer", "tests/fixtures/hyper-query-consumer", "tests/fixtures/facade-contract-consumer"]
resolver = "2"
# A cargo-fuzz crate with its own workspace; fuzz/Cargo.toml says why.
exclude = ["fuzz"]

[workspace.dependencies]
filament-specification-qualification = { git = "https://github.com/agent-ix/filament-specification", rev = "247a394157b58843643a61dfde16280c25d733c0" }
filament-specification = { package = "filament-specification-qualification", git = "https://github.com/agent-ix/filament-specification", rev = "247a394157b58843643a61dfde16280c25d733c0" }
# `default-features = false`: the encoder builds `no_std` + `alloc`, so the
# layer-SV leaf `filament-semantic-value` can mint the compound-unit id
# through it; a crate that writes through `io::Write` turns on `std`.
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.1", default-features = false }
# The shared no_std exact-value kernel and the semantic-value leaf above it,
# each its own repository so IR, RT and CG depend on them without the FSL repo.
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "b26a8e4c592503fccdc4a0e3d2cce23dd8487616", features = ["json-object"] }
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", rev = "6e809434d5fd7bde4c5b88ec40cd809efcca595d" }
# ADR-011 §6.1 layer W: the shared no_std walker toolkit (ADR-030 D-1 item 2),
# its own repository so IR, RT and CG depend on it without the FSL repo.
filament-walk = { git = "https://github.com/agent-ix/filament-walk", tag = "v0.1.1" }
# ADR-011 §6.1 layer C: the checked terms the evaluator reads (FR-400), its own
# repository so IR, RT and CG depend on it without the FSL repo. Only
# `fsl-semantics` requests `construct` in its manifest; Cargo unifies the
# feature across the workspace build.
filament-checked = { git = "https://github.com/agent-ix/filament-eval", rev = "89573102cc309941786e3693b2f71e254dddc91c" }
# ADR-011 §6.1 layer E: the shared evaluation-core interface (FR-262, FR-401),
# its own repository so RT and CG depend on it without the FSL repo.
filament-eval = { git = "https://github.com/agent-ix/filament-eval", rev = "89573102cc309941786e3693b2f71e254dddc91c" }
# IR-owned staged identity, operation-member, and model-enum witness joins.
filament-contract-model = { git = "https://github.com/agent-ix/filament-contract-ir", rev = "1cbd86a48f02e4623e558a3d3b23c066c7f280bf" }
# Observation's checked-value vocabulary aligned to the same exact/semantic-value revisions.
filament-observation = { git = "https://github.com/agent-ix/filament-observation", rev = "1e356f99358aaf0f9bbc42dd3451c44cc61a4d06" }

[package]
name = "filament-spec-language"
version = "0.3.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "Native finite-state specification syntax and source diagnostics"

[features]
default = []
# The checked-handoff writer and its integration acceptance modules. It adds
# no dependency; `--all-features` enables the checked-handoff test surface.
checked-handoff = []
# `population_fixtures`, the writer of the `Population<T>[N]` Contract IR v2
# packages the admission corpus emits (QSL-771). It embeds the spine-model
# fixtures under `tests/fixtures/`, so the default build leaves it out. It
# enables the optional `fsl-eval` dependency.
population-fixtures = ["dep:fsl-eval"]

[dependencies]
# `population_fixtures` checks its spine model through the evaluator's S6a reward
# evaluator; only the `population-fixtures` feature pulls it in.
fsl-eval = { path = "fsl-eval", optional = true }
# ADR-013 O-05: only `model` calls the kernel `EffectiveId` constructor,
# enforced by the ADR-011 T-12 arch-lint `api-surface` check (`tools/arch-lint`),
# not by this dependency edge itself -- every crate that depends on
# `filament-exact` is in that check's scope, this one included as of this edit.
filament-exact = { workspace = true }
# ADR-011 §6.1 layer C: the checked terms (FR-400) `DeclarationKey` and
# `AdmittedIntegerDivision` live in.
filament-checked = { workspace = true }
# ADR-011 §6.1 layer SV: the expression `Origin` the run output renders; the
# tests also assert its refusal vocabulary and runtime enum values.
filament-semantic-value = { workspace = true }
# ADR-013 §2 (ADR-013:113): the FR-051/FR-052 checked-handoff and
# native-temporal document identities encode through the one RFC 8785
# implementation.
quire-canonical = { workspace = true }
# ADR-011 §7.3 X-2: layer F, extracted out of this crate.
fsl-foundation = { path = "fsl-foundation" }
# ADR-011 §7.3 X-3: layer 1, extracted out of this crate.
fsl-cst = { path = "fsl-cst" }
# ADR-011 §7.3 X-5: layer 2, extracted out of this crate.
fsl-forms = { path = "fsl-forms" }
# ADR-011 §7.3 X-6: layer 3, extracted out of this crate. This crate
# re-exports none of its items (ADR-011 §7.2); callers name them at
# `fsl_semantics::...`.
fsl-semantics = { path = "fsl-semantics" }
# ADR-011 §7.3 X-7: layer 4, extracted out of this crate. This crate
# re-exports none of its items (ADR-011 §7.2); callers name them at
# `fsl_package::...`.
fsl-package = { path = "fsl-package" }
# ADR-011 §6.1 layer 6 `replay`: `command`'s CLI `compile` calls
# its spine compile (`fsl_replay::spine`), the one S1-to-S4 chain `replay`
# and `command` share. This crate re-exports none of its items.
fsl-replay = { path = "fsl-replay" }
# The root package directly uses the admitted model projection API.
filament-contract-model = { workspace = true }
logos = "0.16.1"
num-bigint = "0.4.8"
num-integer = "0.1.47"
num-traits = "0.2.19"
serde_json = { version = "1.0.151", features = ["unbounded_depth", "raw_value"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.20"
unicode-normalization = "0.1.25"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }

[dev-dependencies]
# FR-660: acceptance reads the pinned standard only through its published
# file API; production code has no need for this dependency.
filament-specification = { workspace = true }
# Non-core request-file intake exercised by the root acceptance tests.
fsl-command = { path = "fsl-command" }
# The integration tests drive the checked-package temporal evidence call. No
# shipped module of this crate uses it.
fsl-eval = { path = "fsl-eval" }
serde_json_canonicalizer = "0.3.2"
# FR-515-AC-20, FR-516-AC-32: `Emission::with_package_bytes` presents the twin
# package no emitter produces. Only this dev-dependency enables it.
fsl-package = { path = "fsl-package", features = ["test-support"] }
filament-eval = { workspace = true }
# `fsl-semantics`' test-only fixtures and views (`ReaderAuthority::fixture`,
# `DeclarationKey::fixture`, `check::family::fixtures`, ...) for this crate's
# unit and integration tests. Only this dev-dependency may enable
# `test-support`: `tests/it/family_outcome_layering.rs`
# (`no_shipped_dependency_enables_test_support`) refuses a normal or build
# dependency that does. Resolver 2 turns it on only when a test target is
# built, so it never reaches the production lib.
fsl-semantics = { path = "fsl-semantics", features = ["test-support"] }
# FR-400-AC-9: `filament-checked`'s `test-support` (`DeclarationKey::fixture`, ...). Only this
# dev-dependency enables it; `no_shipped_dependency_enables_test_support`
# refuses a normal or build dependency that does.
filament-checked = { workspace = true, features = ["test-support"] }
# ADR-011 §7.3 X-9: layer R, extracted out of this crate. No
# shipped module of this crate calls it, so it is a dev dependency only
# (ADR-011 §7.1: "A dependency needed only by tests is a dev dependency"):
# `tests/it/layer_crate_reexports.rs` checks that this crate re-exports none
# of its items (ADR-011 §7.2).
fsl-route = { path = "fsl-route" }
# FR-571-AC-7: a package compiled back from a checked handoff directory is
# dispatched to the realizability engine. No shipped module calls it.
fsl-analyze = { path = "fsl-analyze" }
# FR-865-AC-7: the export outcome's text form through `render_outcome`. No
# shipped module of this crate renders, so it is a dev dependency only.
fsl-inspect = { path = "fsl-inspect" }
tempfile = "3.27.0"
jsonschema = { version = "0.17.1", default-features = false, features = ["draft202012"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# TC-257 (FR-088-AC-1) reuses `xtask::definition_scan::scan_crate`'s existing
# whole-crate `syn` scanner instead of a second, byte-identical copy; a
# workspace path dependency, dev-only, so it adds no edge to any shipped
# build (PR #300 review).
xtask = { path = "xtask" }
# The ordered charge log (`Meter::admitted_charges`) the
# charge-sequence tests assert. A production meter keeps a count only; only
# this dev-dependency enables `test-support`.
filament-exact = { workspace = true, features = ["test-support"] }
# TC-251's signature scanner (`tests/it/name_resolution_confinement.rs`)
# walks a parameter/return type's own AST directly (an exact path-segment
# match, `syn::visit::Visit`) rather than text-matching a `Debug`-formatted
# tree, so it needs only "full" (the full grammar) and "visit" -- PR #300
# review round 2, L5 dropped the "extra-traits" feature that used to exist
# solely to put `Debug` on `syn::Type` for that string search.
syn = { version = "2.0.119", features = ["full", "visit"] }

[[example]]
name = "population_v2_fixtures"
required-features = ["population-fixtures"]
test = false

# Every former `tests/*.rs` integration-test target is now a
# `mod` of this one `tests/it/main.rs` binary (see that file's own doc for
# the full rationale). It needs no `required-features`: the `fsl-semantics`
# fixtures its modules call are enabled by that crate's dev-dependency above.
[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# QSL#214 (FR-063): `seam_probe` is a `RUSTFLAGS`-set `--cfg`, not a Cargo
# feature -- `--all-features` activates every real Cargo feature
# unconditionally, and this probe is designed to fail to compile (`E0004`),
# so a Cargo feature would break `--all-features` on every build once it
# existed (measured: it did). Declaring the cfg name here is what
# `xtask seam-probe`'s own `RUSTFLAGS=--cfg seam_probe` build needs to avoid
# trading that break for an `unexpected_cfgs` one under `-D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(seam_probe)"] }

[lints.clippy]
all = "deny"

# The 100,000-level formatter identity cases (`make test-deep-format`) spend
# their time hashing and canonically encoding packages. These dependencies are
# compiled optimized once and cached; the checks themselves are unchanged.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.quire-canonical]
opt-level = 3
[profile.dev.package.filament-contract-model]
opt-level = 3
[profile.dev.package.filament-semantic-value]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.filament-exact]
opt-level = 3

# filament-observation depends on this repository's `fsl-foundation` through a
# git dependency on `main`. Patching that source to the workspace member keeps
# one `fsl-foundation` in the graph, so its canonical types are defined once.
[patch."https://github.com/agent-ix/filament-spec-language"]
fsl-foundation = { path = "fsl-foundation" }


# Protocol exploration (QSL-1438: the LT-16 litmus test) spends its time in
# fsl-eval, which compiles at opt-level 3. Its protocol system is generic over
# the memory model, and a generic function compiles in the crate that
# instantiates it, so fsl-eval's own `ProtocolSystem::reachable` instantiates
# the search for its Sc, Tso and Ra models and fsl-analyze and its tests
# (QSL-1564) stay at opt-level 0. Below opt-level 2 a crate reuses the
# unoptimized generic instances of the opt-level 0 crates it depends on
# (QSL-1472 measured fsl-eval at opt-level 1 at 1.8x LT-16's instructions).
# fsl-semantics compiles at opt-level 1; fsl-foundation and the dependencies
# without an explicit level above stay at opt-level 0. Debug assertions stay
# on.
[profile.dev.package.fsl-semantics]
opt-level = 1
[profile.dev.package.fsl-eval]
opt-level = 3
