[workspace]
members = [".", "xtask", "quire-exact", "qsl-attrs", "qsl-foundation", "qsl-cst", "qsl-replay"]
resolver = "2"

[package]
name = "quire-spec-language"
version = "0.2.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "Native finite-state specification syntax and source diagnostics"
default-run = "quire-spec"

[features]
default = []
quire-extraction = ["dep:quire-rs"]
# Test-only fixture constructors (`DeclarationKey::fixture`,
# `DomainPackageRef::fixture`, `DomainPackageRef::fixture_with_version`) that
# derive a digest from a display identity —
# never enabled in a production build; `cargo test --all-features` turns it on
# so integration tests in `tests/` can reach them (PR #140 F13).
test-support = []

[dependencies]
# ADR-013 O-05: only `model` calls the kernel `EffectiveId` constructor,
# enforced by the ADR-011 T-12 arch-lint `api-surface` check (`tools/arch-lint`),
# not by this dependency edge itself -- every crate that depends on
# `quire-exact` is in that check's scope, this one included as of this edit.
quire-exact = { path = "quire-exact" }
# ADR-011 §7.3 X-2 (QSL-177): layer F, extracted out of this crate.
qsl-foundation = { path = "qsl-foundation" }
# ADR-011 §7.3 X-3 (QSL-178): layer 1, extracted out of this crate.
qsl-cst = { path = "qsl-cst" }
quire-rs = { git = "https://github.com/agent-ix/quire-rs", rev = "2823a93bd3797c970c1d389afae9b893dea6f232", optional = true, default-features = false }
logos = "=0.16.1"
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
serde_json = { version = "=1.0.151", features = ["unbounded_depth", "raw_value"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.20"
unicode-normalization = "=0.1.25"
quire-contract-ir = { package = "quire-contract-model", git = "https://github.com/agent-ix/quire-contract-ir", rev = "dbb2e22d577b56fed5c27e81e584370acdf02512" }
qsl-attrs = { path = "qsl-attrs" }
agent-ix-extraction-frontend = { git = "https://github.com/agent-ix/filament-core-data", rev = "1572ba4ba8fad0e94e9a0b19a569f82a5181b488" }
agent-ix-semantic-ir = { git = "https://github.com/agent-ix/filament-core-data", rev = "1572ba4ba8fad0e94e9a0b19a569f82a5181b488" }
# `crate::model::intake::lift_document` calls FCD's `lift`, which always
# writes its document to a required output path (FR-099); this is that
# scratch directory, not test-only.
tempfile = "=3.27.0"

[dev-dependencies]
jsonschema = { version = "=0.17.1", default-features = false, features = ["draft202012"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
# `forms::dispatch`'s unit tests reach `LosslessCst::fixture`, gated on
# `qsl-cst`'s own `test-support` feature (ADR-011 §7.3 X-3, QSL-178 review
# F1); resolver 2 turns this on only when a test target is built, so it
# never reaches the production lib.
qsl-cst = { path = "qsl-cst", features = ["test-support"] }
# TC-257 (FR-088-AC-1) reuses `xtask::definition_scan::scan_crate`'s existing
# whole-crate `syn` scanner instead of a second, byte-identical copy; a
# workspace path dependency, dev-only, so it adds no edge to any shipped
# build (PR #300 review, QSL-158 S-3b).
xtask = { path = "xtask" }
quire-contract-codegen = { git = "https://github.com/agent-ix/quire-contract-codegen", rev = "5e2a6a994d2107f36294078ad202467a4c66bb75" }
quire-contract-ir-historical = { package = "quire-contract-ir", git = "https://github.com/agent-ix/quire-contract-ir", rev = "04eb6f849c03be23177d373549c6c272551f957d" }
# TC-251's signature scanner (`tests/it/name_resolution_confinement.rs`)
# walks a parameter/return type's own AST directly (an exact path-segment
# match, `syn::visit::Visit`) rather than text-matching a `Debug`-formatted
# tree, so it needs only "full" (the full grammar) and "visit" -- PR #300
# review round 2, L5 dropped the "extra-traits" feature that used to exist
# solely to put `Debug` on `syn::Type` for that string search.
syn = { version = "=2.0.119", features = ["full", "visit"] }

[[bin]]
name = "quire-spec"
path = "src/main.rs"

[[bin]]
name = "fixture-audit"
path = "tools/fixture-audit/main.rs"

# FR-059/FR-060/FR-061 (ADR-011 §7.1 T-12, #215): architecture-conformance
# checks over the QSL/IR/RT/CG ecosystem. Self-contained (does not link
# `quire-spec-language`); see tools/arch-lint/main.rs.
[[bin]]
name = "arch-lint"
path = "tools/arch-lint/main.rs"

# QSL-175 (#306): every former `tests/*.rs` integration-test target is now a
# `mod` of this one `tests/it/main.rs` binary (see that file's own doc for
# the full rationale). The seven modules that call the `test-support`-gated
# fixture constructors (`DeclarationKey::fixture`, `DomainPackageRef::fixture`,
# `DomainPackageRef::fixture_with_version`) are gated with
# `#[cfg(feature = "test-support")]` on their own `mod` lines in
# `tests/it/main.rs` instead of `required-features` here, so this single
# target needs none: a default-feature `cargo clippy --all-targets`/`cargo
# test` build (no `test-support`) compiles `it` with those seven modules
# `cfg`'d out, matching the previous per-file behavior (#154) without
# skipping the whole binary.
[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# QSL#214 (FR-063): `seam_probe` is a `RUSTFLAGS`-set `--cfg`, not a Cargo
# feature -- `--all-features` activates every real Cargo feature
# unconditionally, and this probe is designed to fail to compile (`E0004`),
# so a Cargo feature would break `--all-features` on every build once it
# existed (measured: it did). Declaring the cfg name here is what
# `xtask seam-probe`'s own `RUSTFLAGS=--cfg seam_probe` build needs to avoid
# trading that break for an `unexpected_cfgs` one under `-D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(seam_probe)"] }

[lints.clippy]
all = "deny"
