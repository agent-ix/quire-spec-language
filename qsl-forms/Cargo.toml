[package]
name = "qsl-forms"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "ADR-011 §6.1 layer 2: S2 parsed semantic forms -- the forms core's closed dispatch entry table, the parsed-form contract and the shared parsed-form types."

# ADR-011 §6.1 layer 2 depends on "1, F, K" only. The root crate's
# `tests/it/family_outcome_layering.rs` (TC-398) asserts that this table and
# `[dev-dependencies]` name no other workspace crate.
[dependencies]
qsl-cst = { path = "../qsl-cst" }
qsl-foundation = { path = "../qsl-foundation" }
quire-exact = { path = "../quire-exact" }

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
# `dispatch`'s unit tests build CSTs with `LosslessCst::fixture`, gated on
# `qsl-cst`'s own `test-support` feature; resolver 2 turns it on only when a
# test target is built, so it never reaches the production lib.
qsl-cst = { path = "../qsl-cst", features = ["test-support"] }
# `dispatch`'s TC-167 test parses its own source to inspect the dispatch
# `match`; `tests/it/identity_free_forms.rs` (TC-398) walks every field type.
syn = { version = "=2.0.119", features = ["full", "visit"] }
# Line numbers in that walk's findings, the same way `xtask` reads them.
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# FR-063/QSL-143: `seam_probe` is the `RUSTFLAGS`-set `--cfg` `xtask
# seam-probe` builds this crate under (as a dependency of `qsl-semantics` and
# every crate above it): it adds `Expression::__SeamProbe`, a probe-only
# variant this crate's own `Expression::children`/`detach_children`/
# `is_childless` each carry an unconditional arm for, so this crate keeps
# compiling under the probe (the real S2 seam it exists to demonstrate is
# `qsl-semantics`' `Typer::infer_form`, above this crate).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(seam_probe)"] }

[lints.clippy]
all = "deny"
